<!doctype html>
<!-- 공유 미리보기 이미지(public/og-image.png, 1200×630)의 원본. 만드는 법은 scripts/build_assets.mjs 머리 주석 -->
<!-- 사이트와 같은 글꼴·색 토큰·절제(그라데이션 없음, 왼쪽 정렬, 막대·블록)를 따른다 -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Noto Sans Variable';
        src: url('../../node_modules/@fontsource-variable/noto-sans/files/noto-sans-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
      }
      html,
      body {
        margin: 0;
      }
      .card {
        box-sizing: border-box;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 300px;
        align-items: center;
        gap: 64px;
        width: 1200px;
        height: 630px;
        padding: 0 88px;
        font-family: 'Noto Sans Variable', sans-serif;
        color: #17171b;
        background: #f6f5f1;
      }
      .name {
        margin: 0;
        font-size: 96px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.03em;
      }
      .name span {
        color: #0d7068;
      }
      .tagline {
        margin: 28px 0 0;
        font-size: 36px;
        font-weight: 500;
        line-height: 1.3;
        color: #595964;
      }
      .url {
        margin: 40px 0 0;
        font-size: 26px;
        font-weight: 600;
        color: #0d7068;
      }
      /* 파비콘과 같은 막대 세 개 — 커지며 올라가는 움직임을 멈춘 모습 */
      .bars {
        display: flex;
        align-items: flex-end;
        gap: 22px;
        height: 330px;
      }
      .bars i {
        flex: 1;
        border-radius: 10px;
        background: #0d7068;
      }
      .bars i:nth-child(1) {
        height: 38%;
        opacity: 0.45;
      }
      .bars i:nth-child(2) {
        height: 66%;
        opacity: 0.7;
      }
      .bars i:nth-child(3) {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div>
        <h1 class="name">Show<span>Motion</span></h1>
        <p class="tagline">Web motions, shown live.<br />Prompts, ready to paste.</p>
        <p class="url">showmotion.bohehub.com</p>
      </div>
      <div class="bars"><i></i><i></i><i></i></div>
    </div>
  </body>
</html>
